[project]
name = "bms-cli"
version = "0.1.0"
description = "Linux CLI for BLE LiFePO4 BMS boards (reverse engineered from the vendor Android app)"
requires-python = ">=3.9"
dependencies = [
    "bleak>=0.21",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=1.6,<3"]

[project.scripts]
bms-cli = "bms_cli.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bms_cli"]
